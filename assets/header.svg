<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Asthan Patanao</title>
  <desc id="desc">BSIT, Bicol University. A dark plum banner with a shimmering pink name and drifting sakura petals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1020"/>
      <stop offset="0.5" stop-color="#3b1530"/>
      <stop offset="1" stop-color="#1a1030"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F75C9E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#F75C9E" stop-opacity="0"/>
    </radialGradient>
    <!-- Repeating sweep: period 1000px, so translating the 2000px rect by -1000px loops seamlessly -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="2000" y2="0">
      <stop offset="0" stop-color="#F75C9E"/>
      <stop offset="0.16" stop-color="#F75C9E"/>
      <stop offset="0.25" stop-color="#ffd1e3"/>
      <stop offset="0.34" stop-color="#F75C9E"/>
      <stop offset="0.66" stop-color="#F75C9E"/>
      <stop offset="0.75" stop-color="#ffd1e3"/>
      <stop offset="0.84" stop-color="#F75C9E"/>
      <stop offset="1" stop-color="#F75C9E"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1000" height="240" rx="18"/>
    </clipPath>
    <clipPath id="nameClip">
      <text x="500" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700">Asthan Patanao</text>
    </clipPath>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <style>
    .shine { animation: shine 3s linear infinite; }
    @keyframes shine {
      from { transform: translateX(0); }
      to { transform: translateX(-1000px); }
    }
    .p {
      transform-box: fill-box;
      transform-origin: center;
      animation: fall 6s linear infinite;
    }
    @keyframes fall {
      0% { transform: translate(30px, -260px) rotate(-190deg); opacity: 0; }
      10% { opacity: 0.85; }
      85% { opacity: 0.85; }
      100% { transform: translate(-30px, 260px) rotate(190deg); opacity: 0; }
    }
    .p1 { animation-duration: 6.2s; animation-delay: -1s; }
    .p2 { animation-duration: 7.4s; animation-delay: -3.5s; }
    .p3 { animation-duration: 5.3s; animation-delay: -2.2s; }
    .p4 { animation-duration: 8s; animation-delay: -5s; }
    .p5 { animation-duration: 6.8s; animation-delay: -0.4s; }
    .p6 { animation-duration: 5.6s; animation-delay: -4.1s; }
    .p7 { animation-duration: 7.1s; animation-delay: -2.9s; }
    .p8 { animation-duration: 6.5s; animation-delay: -6s; }
    @media (prefers-reduced-motion: reduce) {
      .shine, .p { animation: none; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <ellipse cx="500" cy="120" rx="380" ry="120" fill="url(#glow)"/>
    <ellipse cx="80" cy="20" rx="200" ry="110" fill="url(#glow)"/>
    <ellipse cx="930" cy="230" rx="220" ry="110" fill="url(#glow)"/>

    <!-- Sakura petals: each fall starts above and ends below the banner; with reduced motion the petals rest as a calm scatter at these positions -->
    <g fill="#ffb3d1">
      <g transform="translate(50 50) scale(1.1)"><path d="M0 -14 C5.6 -5.6 9.8 1.4 9.8 5.6 A9.8 9.8 0 0 1 -9.8 5.6 C-9.8 1.4 -5.6 -5.6 0 -14 Z" class="p p1" opacity="0.85"/></g>
      <g transform="translate(170 190) scale(0.8)"><path d="M0 -14 C5.6 -5.6 9.8 1.4 9.8 5.6 A9.8 9.8 0 0 1 -9.8 5.6 C-9.8 1.4 -5.6 -5.6 0 -14 Z" class="p p2" opacity="0.85"/></g>
      <g transform="translate(290 40) scale(1)"><path d="M0 -14 C5.6 -5.6 9.8 1.4 9.8 5.6 A9.8 9.8 0 0 1 -9.8 5.6 C-9.8 1.4 -5.6 -5.6 0 -14 Z" class="p p3" opacity="0.85"/></g>
      <g transform="translate(420 208) scale(0.7)"><path d="M0 -14 C5.6 -5.6 9.8 1.4 9.8 5.6 A9.8 9.8 0 0 1 -9.8 5.6 C-9.8 1.4 -5.6 -5.6 0 -14 Z" class="p p4" opacity="0.85"/></g>
      <g transform="translate(560 32) scale(0.9)"><path d="M0 -14 C5.6 -5.6 9.8 1.4 9.8 5.6 A9.8 9.8 0 0 1 -9.8 5.6 C-9.8 1.4 -5.6 -5.6 0 -14 Z" class="p p5" opacity="0.85"/></g>
      <g transform="translate(690 200) scale(1.2)"><path d="M0 -14 C5.6 -5.6 9.8 1.4 9.8 5.6 A9.8 9.8 0 0 1 -9.8 5.6 C-9.8 1.4 -5.6 -5.6 0 -14 Z" class="p p6" opacity="0.85"/></g>
      <g transform="translate(820 58) scale(0.85)"><path d="M0 -14 C5.6 -5.6 9.8 1.4 9.8 5.6 A9.8 9.8 0 0 1 -9.8 5.6 C-9.8 1.4 -5.6 -5.6 0 -14 Z" class="p p7" opacity="0.85"/></g>
      <g transform="translate(950 182) scale(1.05)"><path d="M0 -14 C5.6 -5.6 9.8 1.4 9.8 5.6 A9.8 9.8 0 0 1 -9.8 5.6 C-9.8 1.4 -5.6 -5.6 0 -14 Z" class="p p8" opacity="0.85"/></g>
    </g>

    <!-- Soft glow behind the name -->
    <text x="500" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#F75C9E" opacity="0.35" filter="url(#soft)">Asthan Patanao</text>

    <!-- Solid fallback: visible if clip-path text is unsupported; shimmer paints over it -->
    <text x="500" y="125" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#F75C9E">Asthan Patanao</text>
    <!-- Name: a wide gradient rect clipped by the text, translated by CSS for the shimmer -->
    <g clip-path="url(#nameClip)">
      <rect x="0" y="40" width="2000" height="110" fill="url(#shine)" class="shine"/>
    </g>

    <text x="500" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" letter-spacing="1" fill="#ffd6e7">BSIT · Bicol University</text>

    <rect x="0.75" y="0.75" width="998.5" height="238.5" rx="17.25" fill="none" stroke="#F75C9E" stroke-opacity="0.25" stroke-width="1.5"/>
  </g>
</svg>
